server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }

    # Avoid stale frontend after redeploys (single-file app.js)
    location = /js/app.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    # Proxy /v1 API requests to the real backend
    # Proxy /v1 API requests to the backend
    location /v1/ {
        # --- API BACKEND SWITCH ---
        # Option A: Local API (Host) - Use if backend is running directly on your Mac
        # proxy_pass http://host.docker.internal:8055;
        
        # Option B: Local API (Docker) - Use if backend is running via docker-compose
        # proxy_pass http://api:8055;
        
        # Option C: Deployed API
        proxy_pass https://course-learning-companion-production.up.railway.app;
        proxy_ssl_server_name on;
        # Railway needs the upstream Host/SNI to match.
        proxy_set_header Host course-learning-companion-production.up.railway.app;
        # --------------------------

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        # SSE settings
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy /reports to the core backend
    location /reports/ {
        # --- API BACKEND SWITCH ---
        # Option A: Local API (Host)
        # proxy_pass http://host.docker.internal:8055/reports/;
        
        # Option B: Local API (Docker)
        # proxy_pass http://api:8055/reports/;
        
        # Option C: Deployed API
        proxy_pass https://course-learning-companion-production.up.railway.app/reports/;
        proxy_ssl_server_name on;
        proxy_set_header Host course-learning-companion-production.up.railway.app;
        # --------------------------
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
