server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }

    # Avoid stale frontend after redeploys (single-file app.js)
    location = /js/app.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    # Proxy /v1 API requests to the real backend
    location /v1/ {
        proxy_pass https://course-learning-companion-production.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header Host course-learning-companion-production.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        # SSE settings
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy /reports to the core backend too
    location /reports/ {
        proxy_pass https://course-learning-companion-production.up.railway.app/reports/;
        proxy_ssl_server_name on;
        proxy_set_header Host course-learning-companion-production.up.railway.app;
    }
}
