<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "outline": "#74777d",
                    "surface-container-highest": "#e1e2e4",
                    "on-secondary-fixed": "#141c23",
                    "surface-variant": "#e1e2e4",
                    "on-primary": "#ffffff",
                    "on-secondary-fixed-variant": "#404850",
                    "error": "#ba1a1a",
                    "tertiary": "#515f75",
                    "on-tertiary-container": "#455469",
                    "tertiary-fixed-dim": "#b8c7e0",
                    "surface-bright": "#f8f9fb",
                    "primary": "#4e6075",
                    "on-secondary": "#ffffff",
                    "outline-variant": "#c4c6cd",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed": "#0a1d2f",
                    "surface-container-high": "#e7e8ea",
                    "on-secondary-container": "#5d656e",
                    "surface-tint": "#4e6075",
                    "tertiary-container": "#b9c8e1",
                    "surface-dim": "#d9dadc",
                    "inverse-primary": "#b6c8e1",
                    "on-error": "#ffffff",
                    "inverse-on-surface": "#f0f1f3",
                    "on-tertiary-fixed-variant": "#39485c",
                    "secondary": "#575f68",
                    "primary-fixed": "#d2e4fe",
                    "secondary-fixed": "#dbe3ed",
                    "on-tertiary-fixed": "#0d1c2f",
                    "surface-container-low": "#f2f4f6",
                    "inverse-surface": "#2e3132",
                    "on-surface-variant": "#44474c",
                    "on-error-container": "#93000a",
                    "on-primary-container": "#43546a",
                    "error-container": "#ffdad6",
                    "secondary-fixed-dim": "#bfc7d1",
                    "on-background": "#191c1e",
                    "secondary-container": "#dbe3ed",
                    "on-primary-fixed-variant": "#37485d",
                    "tertiary-fixed": "#d4e3fd",
                    "surface": "#f8f9fb",
                    "on-surface": "#191c1e",
                    "primary-fixed-dim": "#b6c8e1",
                    "background": "#f8f9fb",
                    "primary-container": "#b7c9e2",
                    "surface-container-lowest": "#ffffff",
                    "surface-container": "#edeef0"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "md": "24px",
                    "sm": "12px",
                    "xs": "4px",
                    "xl": "80px",
                    "lg": "48px",
                    "base": "8px",
                    "gutter": "24px",
                    "container-max": "1200px"
            },
            "fontFamily": {
                    "caption": ["Manrope"],
                    "display-lg": ["Manrope"],
                    "body-md": ["Manrope"],
                    "title-lg": ["Manrope"],
                    "headline-sm": ["Manrope"],
                    "label-md": ["Manrope"],
                    "headline-md": ["Manrope"],
                    "body-lg": ["Manrope"]
            },
            "fontSize": {
                    "caption": ["12px", {"lineHeight": "1.4", "fontWeight": "400"}],
                    "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "title-lg": ["20px", {"lineHeight": "1.4", "fontWeight": "500"}],
                    "headline-sm": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "1.0", "letterSpacing": "0.02em", "fontWeight": "600"}],
                    "headline-md": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-primary-container min-h-screen flex items-center justify-center font-body-md text-on-surface">
<!-- Login Container -->
<main class="w-full max-w-[440px] px-md">
<!-- Welcome Section -->
<div class="text-center mb-lg">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-surface-container-lowest mb-md shadow-sm">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="auto_stories">auto_stories</span>
</div>
<h1 class="font-display-lg text-headline-md text-on-primary-container tracking-tight">Course Learning Assistant</h1>
<p class="font-body-md text-on-tertiary-fixed-variant mt-xs">Your serene space for intellectual growth</p>
</div>
<!-- Login Card -->
<div class="glass-card rounded-xl p-lg shadow-[0_24px_48px_-12px_rgba(78,96,117,0.15)]">
<div class="space-y-md">
<div class="text-center">
<h2 id="auth-title" class="font-headline-sm text-title-lg text-primary">Welcome Back</h2>
<p id="auth-subtitle" class="font-caption text-secondary mt-xs">Please enter your username to continue</p>
</div>
<form id="login-form" class="space-y-md">
<!-- Username Input -->
<div class="space-y-xs">
<label class="font-label-md text-on-surface-variant px-xs" for="username">Username</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors duration-200" data-icon="person">person</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-surface-container-low border-transparent border-2 rounded-lg font-body-md text-on-surface placeholder:text-outline/60 focus:bg-surface-container-lowest focus:border-primary-container focus:ring-0 transition-all duration-300" id="username" name="username" placeholder="Enter your identity..." type="text" required/>
</div>
</div>
<!-- Login Button -->
<button class="w-full py-4 bg-primary text-on-primary font-label-md rounded-lg shadow-lg shadow-primary/20 hover:bg-primary/90 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                        Enter Workspace
                        <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>

<!-- Register Form (hidden by default) -->
<form id="register-form" class="space-y-md hidden">
<div class="space-y-xs">
    <label class="font-label-md text-on-surface-variant px-xs" for="reg-username">Username</label>
    <div class="relative group">
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors duration-200" data-icon="person">person</span>
        <input class="w-full pl-12 pr-4 py-3.5 bg-surface-container-low border-transparent border-2 rounded-lg font-body-md text-on-surface placeholder:text-outline/60 focus:bg-surface-container-lowest focus:border-primary-container focus:ring-0 transition-all duration-300" id="reg-username" type="text" required/>
    </div>
</div>
<div class="space-y-xs">
    <label class="font-label-md text-on-surface-variant px-xs" for="reg-name">Full Name</label>
    <div class="relative group">
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors duration-200" data-icon="badge">badge</span>
        <input class="w-full pl-12 pr-4 py-3.5 bg-surface-container-low border-transparent border-2 rounded-lg font-body-md text-on-surface placeholder:text-outline/60 focus:bg-surface-container-lowest focus:border-primary-container focus:ring-0 transition-all duration-300" id="reg-name" type="text" required/>
    </div>
</div>
<div class="space-y-xs">
    <label class="font-label-md text-on-surface-variant px-xs" for="reg-courses">Courses (comma separated)</label>
    <div class="relative group">
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors duration-200" data-icon="school">school</span>
        <input class="w-full pl-12 pr-4 py-3.5 bg-surface-container-low border-transparent border-2 rounded-lg font-body-md text-on-surface placeholder:text-outline/60 focus:bg-surface-container-lowest focus:border-primary-container focus:ring-0 transition-all duration-300" id="reg-courses" type="text" placeholder="e.g. CS101, CS231N"/>
    </div>
</div>
<button class="w-full py-4 bg-primary text-on-primary font-label-md rounded-lg shadow-lg shadow-primary/20 hover:bg-primary/90 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                        Create Account
                        <span class="material-symbols-outlined text-[18px]" data-icon="how_to_reg">how_to_reg</span>
</button>
</form>
<!-- Footer Links -->
<div class="pt-md flex flex-col items-center gap-md border-t border-outline-variant/30">
<button id="toggle-register-btn" class="font-label-md text-secondary hover:text-primary transition-colors">
                        Need an account? Register here
                    </button>
<div class="flex items-center gap-base">
<div class="h-[1px] w-8 bg-outline-variant/30"></div>
<span class="font-caption text-outline">or</span>
<div class="h-[1px] w-8 bg-outline-variant/30"></div>
</div>
<div class="grid grid-cols-2 gap-sm w-full">
<button class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-lg border border-outline-variant text-secondary font-label-md hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="info">info</span>
                            About
                        </button>
<button class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-lg border border-outline-variant text-secondary font-label-md hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="help">help</span>
                            Support
                        </button>
</div>
</div>
</div>
</div>
<!-- Semantic Bottom Footer -->
<footer class="mt-xl text-center">
<p class="font-caption text-on-primary-container/60">
                Designed for Deep Focus &amp; Effortless Synthesis
            </p>
</footer>
</main>
<!-- Background Decorative Element (Abstract Soft Geometry) -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -right-[5%] w-[500px] h-[500px] rounded-full bg-primary-fixed-dim/30 blur-[100px]"></div>
<div class="absolute -bottom-[10%] -left-[5%] w-[600px] h-[600px] rounded-full bg-tertiary-fixed/20 blur-[120px]"></div>
</div>
<!-- Visual Anchor Image (Subtle context) -->
<div class="hidden lg:block fixed bottom-md right-md w-64 h-64 opacity-20 grayscale hover:grayscale-0 transition-all duration-700">
<img class="w-full h-full object-cover rounded-xl shadow-sm" data-alt="A serene and minimalist study setting featuring an open book and a small ceramic cup of tea on a clean white desk. The lighting is soft and natural, coming from a nearby window, casting gentle shadows. The overall aesthetic is peaceful and academic, utilizing a soft blue and white color palette that evokes a sense of intellectual serenity and focused learning." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAe8lruArLfKkraV9dMOOCUyFsNCD3tNhOsVyeqgmtzoUfiGsQCefOl69fyxZBjyW9qhwyAR2qrp8egXnvLapC-xD5YFoxEoaZHkhPPkRorJWYqu40rqJXArvk2YAA0lK7QgZHq3ZPUMxZi92WAqpFUx3v3BVRjqf-wL5iwXXUhj8-iB4MMbXgDZPWhiElrBMyJFtgCn792iRNXxn1cQd2fNCYa7xMM5LEmqMEuzAMm7GQYL2fEzYd4bSRkz3MRhUk5umOBTXNH5yEL"/>
</div>
<script src="js/app.js"></script></body></html>
